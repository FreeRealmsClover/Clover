version: "3.9"

services:
  # --- Sanctuary game server emulator ---
  # Clone https://github.com/Open-Source-Free-Realms/Sanctuary into ./Sanctuary
  # before running `docker compose up` — this service builds from that source.
  sanctuary:
    build:
      context: ./Sanctuary
      dockerfile: Dockerfile
    container_name: clover-sanctuary
    ports:
      - "20030:20030" # Login — match whatever Sanctuary's config actually uses
      - "20031:20031" # Gateway — match whatever Sanctuary's config actually uses
    volumes:
      - sanctuary-data:/data
    restart: unless-stopped

volumes:
  sanctuary-data:

services:
  sanctuary.mysql:
    image: mariadb:10.5
    container_name: sanctuary.mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sanctuary}
      MYSQL_USER: ${MYSQL_USER:-sanctuary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    # No public port mapping - only reachable over the internal docker
    # network by the other services. Use `docker compose exec sanctuary.mysql
    # mariadb -uroot -p` for local admin access, or a temporary SSH tunnel
    # if you need a GUI client.
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sanctuary.webapi:
    image: ${DOCKER_REGISTRY-}sanctuary-webapi
    container_name: sanctuary.webapi
    build:
      context: ../
      dockerfile: Docker/Sanctuary.WebAPI.dockerfile
    restart: unless-stopped
    ports:
      - "20040:20040"
    volumes: &common-volumes
      - ../../logs:/app/Logs
      - ../../src/Resources:/app/Resources
      - ../../src/Scripts:/app/Scripts
    environment: &common-env
      - Database__Provider=0 # MySql (MariaDB uses the same provider)
      - Database__VersionString=10.5.29-mariadb
      - Database__ConnectionString=Server=sanctuary.mysql;Port=3306;Database=${MYSQL_DATABASE:-sanctuary};User=${MYSQL_USER:-sanctuary};Password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env};
      - Server__LoginGatewayAddress=sanctuary.login:20041
      - Server__ServerAddress=40.160.90.7:20260
      - Server__LoginGatewayChallenge=${LOGIN_GATEWAY_CHALLENGE:?Set LOGIN_GATEWAY_CHALLENGE in .env}
      - VpnApi__ApiKey=${VPNAPI_API_KEY}
      - Urls=http://0.0.0.0:20040
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

  sanctuary.gateway:
    image: ${DOCKER_REGISTRY-}sanctuary-gateway
    container_name: sanctuary.gateway
    build:
      context: ../
      dockerfile: Docker/Sanctuary.Gateway.dockerfile
    restart: unless-stopped
    ports:
      - "20260:20260/udp"
    volumes: *common-volumes
    environment: *common-env
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

  sanctuary.login:
    image: ${DOCKER_REGISTRY-}sanctuary-login
    container_name: sanctuary.login
    build:
      context: ../
      dockerfile: Docker/Sanctuary.Login.dockerfile
    restart: unless-stopped
    ports:
      - "20041:20041/udp"
      - "20042:20042/udp"
    volumes: *common-volumes
    environment: *common-env
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

volumes:
  db:
